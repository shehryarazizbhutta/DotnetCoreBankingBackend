name: Deploy Banking API

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'


      - name: Install EF Core Tool
        run: dotnet tool install --global dotnet-ef


      - name: Restore dependencies
        run: dotnet restore BankingApp.Api/BankingApp.Api.csproj


      - name: Run Database Migration
        run: |
          dotnet ef database update \
          --project BankingApp.Infrastructure/BankingApp.Infrastructure.csproj \
          --startup-project BankingApp.Api/BankingApp.Api.csproj
        env:
          ConnectionStrings__BankingAppDb: ${{ secrets.AZURE_DB_CONNECTION }}


      - name: Build Docker image
        run: docker build -t bankingbackend-api .


      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}


      - name: Push Docker image to ACR
        run: |
          docker tag bankingbackend-api ${{ secrets.ACR_LOGIN_SERVER }}/bankingbackend-api:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/bankingbackend-api:latest